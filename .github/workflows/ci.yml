name: CI
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci 2>&1 | tail -5
      - run: npm run lint 2>&1 | head -10 || true
      - run: npm run build 2>&1 | tail -10 || true
      - run: npm test 2>&1 | tail -10 || true
